ageAlt":"Vetroplasi Foto.png","imageX":50,"imageY":50,"imageZoom":100,"responsiveImage":{"width":512,"height":512,"variants":[{"src":"assets/19e36367a0cd78405e222219.jpg","width":512,"height":512}]}},{"id":"7a3c5937-c1ca-460c-911e-bb43054b41e5","type":"text","x":180,"y":2203.2409374999997,"w":255,"h":56,"text":"VĚTROPLAŠI \n(Naivní divadlo Liberec)","color":"#000000","size":20,"rotation":0,"z":0,"sectionId":"repertoar","contentHeight":56,"link":"#/vetroplasi-naivni-divadlo-liberec","performancePageId":"vetroplasi-naivni-divadlo-liberec","align":"center"},{"id":"383ddaaf-4fce-4ae1-bd49-39d6fc1a628c","type":"text","x":28.600830078125,"y":2501.0881249999998,"w":557.79833984375,"h":358.20703125,"text":"TMEL vznikl v roce 2021 na Katedře alternativního a loutkového divadla DAMU. Naším cílem je společně tvořit na poli loutkového a objektového divadla a prostřednictvím průzkumu témat, materiálů a různých tvůrčích přístupů ohledávat jeho možnosti. Při tvorbě klademe důraz na propojení společenských i osobních témat s dramaturgicky a esteticky odpovídajícím výtvarným pojetím přístupným dětem i dospělým. Ve svých inscenacích společně zkoumáme, jak vytvářením světů, prací s objekty, netradičními materiály a autorskou hudbou otevírat prostor pro imaginaci a meditaci nad tematickými podněty ale také pro volné asociace a ponoření do atmosféry a vlastních myšlenek.","color":"#000000","size":20,"rotation":0,"opacity":1,"fill":"#5982c5","radius":0,"z":6,"translations":{"en":{"text":"TMEL was founded in 2021 at the Department of Alternative and Puppet Theatre at DAMU in Prague. We create collaboratively in puppetry and object theatre, exploring its possibilities through different themes, materials, and creative approaches. Our work connects social and personal themes with a visual language that supports them both dramaturgically and aesthetically, making our productions accessible to children and adults alike. In our productions, we explore how world-building, objects, unconventional materials, and original music can open up space for imagination and contemplation, as well as free association and immersion in an atmosphere and one’s own thoughts."}},"sectionId":"kolektiv","contentHeight":358.20703125,"align":"justify"},{"id":"afd8eb15-aa15-4c6e-9992-c9756b129853","type":"shape","x":35,"y":2889.6623437499998,"w":255,"h":255,"text":"","color":"#beba18","size":38,"rotation":0,"fill":"#151515","radius":2,"z":0,"sectionId":"kolektiv","link":"#/antonie-rasilovova","memberPageId":"antonie-rasilovova","name":"Antonie Foto","imageSrc":"assets/0de274c703a4833ac938e360.jpg","imageAlt":"Antonie Foto.png","imageX":50,"imageY":50,"imageZoom":100,"gridCard":{"captionId":"3b2b6098-c53c-455f-becd-986bcb297245","gap":35,"nameGap":6,"nameHeight":56},"responsiveImage":{"width":512,"height":512,"variants":[{"src":"assets/0de274c703a4833ac938e360.jpg","width":512,"height":512}]}},{"id":"3b2b6098-c53c-455f-becd-986bcb297245","type":"text","x":35,"y":3144.6623437499998,"w":255,"h":56,"text":"Antonie Rašilovová","color":"#000000","size":20,"rotation":0,"z":0,"sectionId":"kolektiv","contentHeight":56,"link":"#/antonie-rasilovova","memberPageId":"antonie-rasilovova","align":"center"},{"id":"fafcf6a3-d6f1-44cd-9997-0d285178245a","type":"shape","x":325,"y":2889.6623437499998,"w":255,"h":255,"text":"","color":"#beba18","size":38,"rotation":0,"fill":"#151515","radius":2,"z":0,"sectionId":"kolektiv","link":"#/berta-doubkova","memberPageId":"berta-doubkova","name":"Berta Foto","imageSrc":"assets/2e416c6efe9c519d2b99d692.jpg","imageAlt":"Berta Foto.png","imageX":50,"imageY":50,"imageZoom":100,"gridCard":{"captionId":"a74d7eee-5c37-46a5-a55b-d900f60123a0","gap":35,"nameGap":6,"nameHeight":56},"responsiveImage":{"width":512,"height":512,"variants":[{"src":"assets/2e416c6efe9c519d2b99d692.jpg","width":512,"height":512}]}},{"id":"a74d7eee-5c37-46a5-a55b-d900f60123a0","type":"text","x":325,"y":3144.6623437499998,"w":255,"h":56,"text":"Berta Doubková","color":"#000000","size":20,"rot color":"#111111","size":32,"rotation":0,"opacity":1,"z":0,"align":"center","name":"title","performanceRole":"title","text":"PELECH","anchor":"overview","sectionId":"overview","contentHeight":60},{"id":"pelech-hero","type":"image","x":0,"y":144.875,"w":615,"h":346,"color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"hero","performanceRole":"hero","src":"assets/6779eb099f91d184b7891488.png","alt":"Pelech — fotografie z inscenace","fit":"cover","crop":{"x":0.344375,"y":0.06793603845087347,"w":0.31125,"h":0.1284776781587947},"sectionId":"overview","responsiveImage":{"width":3952,"height":5345,"variants":[{"src":"assets/58c847ac577de78629aa2db3.png","width":480,"height":649},{"src":"assets/8506de523ea0997864a5d3af.png","width":960,"height":1298},{"src":"assets/0982cc52eae43074b06c91c9.png","width":1600,"height":2164},{"src":"assets/aec246d4f805a0e61af1e977.png","width":2560,"height":3462},{"src":"assets/6779eb099f91d184b7891488.png","width":3952,"height":5345}]}},{"id":"pelech-intro","type":"text","x":36,"y":516.75,"w":543,"h":150.58984375,"color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"intro","performanceRole":"intro","anchor":"intro","text":"Loutková výprava neznámou divočinou pro diváky od sedmi let. Kdo se to chruje pod kameny? Jeden chce druhého sežrat, jiný všechny přelstít. Někteří spolupracují, jiní soupeří a někdo se raději schová. Ale co dělat, když přijdete o bezpečí svého pelechu?","translations":{"en":{"text":"A puppet expedition through an unknown wilderness for audiences aged seven and up. Who is wriggling under the rocks? One wants to eat the other, another tries to outsmart everyone; some cooperate, others compete, and someone just prefers to hide. But what happens when you lose the safety of your nest?"}},"sectionId":"intro","contentHeight":151},{"id":"pelech-description","type":"text","x":36,"y":696.484375,"w":543,"h":244.31640625,"color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"description","performanceRole":"description","anchor":"description","text":"Přes své drobné měřítko otevírá Pelech rozsáhlý a propracovaný svět, stvořený z červeného písku a surového sklolaminátu – svět, v němž i ten nejmenší tvor může změnit rovnováhu celé planety. Beze slov a za doprovodu imaginativní zvukové krajiny zve Pelech diváky, aby se ztratili na tomto podivuhodném místě, odkryli vrstvy nehostinné pouštní planety a potkali obyvatele tohoto jedinečného, vzájemně propojeného ekosystému.","translations":{"en":{"text":"Though small in scale, The Nest opens up a vast, intricate world where even the tiniest creature can shift the balance of an entire planet. Told without words and accompanied by a rich, imaginative soundscape, it invites the audience to come and witness this strange place."}},"sectionId":"description","contentHeight":244.31640625},{"id":"pelech-credits","type":"text","x":36,"y":963.91015625,"w":523.82421875,"h":417.94140625,"color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"credits","performanceRole":"credits","anchor":"credits","text":"režie: Viktor Prokop\nscénografie: Berta Doubková\nhudba: Jan Froněk\nHrají: Jakub Müller, Marie Machová, Nick Ferenc\n\npremiéra: 9. listopadu 2024\n\nvhodné od: 7+\ndélka: 50 minut\nJazykově bezbariérové\nkapacita: 40 diváků (lze po domluvě navýšit vzhledem k možnostem prostoru)\n\nbooking: kolektiv.tmel@gmail.com","translations":{"en":{"text":"Directed by: Viktor Prokop  \nSet design: Berta Doubková  \nMusic: Jan Froněk  \nPerformed by: Jakub Müller, Marie Machová, Nick Ferenc\n\nPremiere: 9 November 2024\n\nRecommended age: 7+  \nRunning time: 50 minutes  \nAccessible to audiences of all languages  \nAudience capacity: 40 (can be increased by arrangement, depending on the venue)\n\nBooking: kolektiv.tmel@gmail.com"}},"sectionId":"credits","contentHeight":418},{"id":"pelech-media-one","type":"shape","x":0,"y":1586.759765625,"w":615,"h":346,"color":"#111111", 6883-2845-4363-a45e-5bfaa2a2fb77","type":"text","x":36,"y":1511.759765625,"w":247.69140625,"h":32.69140625,"text":"Odkaz na plakát","color":"#000000","size":21,"rotation":0,"opacity":1,"fill":"#5982c5","radius":0,"z":1,"sectionId":"credits","contentHeight":33,"link":"https://drive.google.com/file/d/1Eh_0VYTRwb-M8BaVAl39jrKlFdtG4_uJ/view?usp=sharing","translations":{"en":{"link":"","text":"Link to the poster"}},"align":"left"},{"id":"ba809c79-2add-48c6-a584-7a631fc39aee","type":"text","x":36,"y":1468.515625,"w":293.38671875,"h":31.015625,"text":"Odkaz na fotografie inscenace","color":"#000000","size":21,"rotation":0,"opacity":1,"fill":"#5982c5","radius":0,"z":1,"sectionId":"credits","contentHeight":31.015625,"link":"https://drive.google.com/drive/folders/1FjdlegnE6Q9r84jFtjB7UZd_Yye0q9XK?usp=share_link","translations":{"en":{"link":"","text":"Link to photos"}},"align":"left"},{"id":"389c5463-f47b-427d-9e42-c94197453a40","type":"text","x":36,"y":2374.935546875,"w":543,"h":525.73046875,"text":"Napsali o Pelechu:\n\n“Hledání domova, nomádství, poušť, Rudá planeta. Inscenace skupiny TMEL originálním způsobem zpracovává téma ztráty zázemí, soupeření, spolupráce a putovního života. Objevuje život na pouštní planetě, kde nomádi putují za tajemným světlem a kde mezi sebou všemožní tvorové zápasí o přežití. Každý narativ má jasně daný cíl, a příběh je tak čistý a nepouští diváckou pozornost.”\n -  časopis LOUTKÁŘ\n\n“Dospělí diváci kolem mě reagují smíchem a úžasem nad dalšími promyšlenými mechanismy, které inscenace nabízí. Experimentování s materiálem a mnohovrstevnatým vyprávěním (...) vyvolalo nadšený potlesk diváků.” \n-  Tereza Kubalová, Festival Regiony Hradec Králové\n","color":"#000000","size":21,"rotation":0,"opacity":1,"fill":"#5982c5","radius":0,"z":2,"sectionId":"media-two","contentHeight":526,"align":"left","translations":{"en":{"text":"PRESS:\n\n“Searching for Home, Nomadism, Desert, the Red Planet. The performance by the TMEL group explores the theme of lost security, rivalry, cooperation, and a wandering lifestyle in an original way. It uncovers life on a desert planet, where nomads journey in search of a mysterious light and where various creatures struggle to survive. Each narrative has a clearly defined goal, making the story clean and focused, never letting go of the viewer’s attention.” \n-  LOUTKÁŘ magazine\n\n“The adult audience around me reacts with laughter and amazement at the other ingenious mechanisms offered by the production. Experimenting with material and multi-layered storytelling based on the legend of the local planet evoked enthusiastic applause from the audience.” \n- Tereza Kubalová, REGIONS International Theatre Festival Hradec Králové\n"}}}],"performance":{"sourcePageId":"home","sourceHeadingId":"b8","sourceAnchor":"repertoar","sourceItemIds":["b13","b12"],"title":"Pelech"},"sectionLayout":{"version":1,"enabled":true,"autoHeight":true,"bottomPadding":136,"minHeight":700,"sections":[{"id":"overview","headerId":"pelech-title","label":"PELECH","gapBefore":0,"top":62,"bottom":490.875},{"id":"intro","headerId":"pelech-intro","label":"Loutková výprava neznámou divočinou pro diváky od sedmi let. Kdo se to chruje pod kameny? Jeden chce druhého sežrat, jiný všechny přelstít. Někteří spolupracují, jiní soupeří a někdo se raději schová. Ale co dělat, když přijdete o bezpečí svého pelechu?","gapBefore":25.875,"top":516.75,"bottom":667.75},{"id":"description","headerId":"pelech-description","label":"Přes své drobné měřítko otevírá Pelech rozsáhlý a propracovaný svět, stvořený z červeného písku a surového sklolaminátu – svět, v němž i ten nejmenší tvor může změnit rovnováhu celé planety. Beze slov a za doprovodu imaginativní zvukové krajiny zve Pelech diváky, aby se ztratili na tomto podivuhodném místě, odkryli vrstvy nehostinné pouštní planety a potkali obyvatele tohoto jedinečného, vzájemně propojeného ekosystému.","gapBefore":28.734375,"top":696.484375,"bottom":940.80078125},{"id":"credits","headerId":"pelech-credits","label":"režie: Viktor Prokop\nscénografie: Berta Doubková\nhudba: Jan Froněk\nHrají: Jakub Müller, Marie Machová, Nick Ferenc\n\npremiéra: 9. listopadu 2024\n\nvhodné od: 7+\ndélka: 50 minut\nJazykově bezbariérové\nkapacita: 40 diváků (lze po domluvě navýšit vzhledem k možnostem prostoru)\n\nbooking: kolektiv.tmel@gmail.com","gapBefore":23.109375,"top":963.91015625,"bottom":1544.759765625},{"id":"media-one","headerId":"pelech-media-one","label":"Gallery / video area 1","gapBefore":42,"top":1586.759765625,"bottom":1932.759765625},{"id":"media-two","headerId":"pelech-media-two","label":"Gallery / video area 2","gapBefore":39.57421875,"top":1972.333984375,"bottom":2900.935546875}]}},{"id":"o-jako-otesanek","name":"O jako Otesánek","title":"O jako Otesánek — TMEL","kind":"performance","width":615,"height":2463,"background":"#fff4d9","items":[{"id":"o-jako-otesanek-back","type":"text","x":36,"y":18,"w":160,"h":30,"color":"#111111","size":18,"rotation":0,"opacity":1,"z":0,"align":"left","name":"back","performanceRole":"back","text":"← Zpět","link":"#/home/repertoar","translations":{"en":{"text":"← Back"}},"sectionId":"","contentHeight":30},{"id":"o-jako-otesanek-title","type":"text","x":36,"y":62,"w":543,"h":60,"color":"#111111","size":32,"rotation":0,"opacity":1,"z":0,"align":"center","name":"title","performanceRole":"title","text":"O JAKO OTESÁNEK","anchor":"overview","sectionId":"overview","contentHeight":60},{"id":"o-jako-otesanek-hero","type":"shape","x":0,"y":145,"w":615,"h":346,"color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"Performance photograph — replace with image","performanceRole":"hero","fill":"#000000","sectionId":"overview"},{"id":"o-jako-otesanek-intro","type":"text","x":36,"y":517,"w":543,"h":76,"color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"intro","performanceRole":"intro","anchor":"intro","text":"Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod temp onie Rašilovová — portrét","fit":"cover","translations":{"en":{"alt":"Antonie Rašilovová — portrait"}},"sectionId":"profile","imageSource":{"pageId":"home","itemId":"afd8eb15-aa15-4c6e-9992-c9756b129853"}},{"id":"antonie-rasilovova-name","type":"text","x":346,"y":107,"w":233,"h":72,"text":"Antonie Rašilovová","color":"#111111","size":24,"rotation":0,"opacity":1,"z":0,"align":"left","name":"name","memberRole":"name","sectionId":"profile","contentHeight":72},{"id":"antonie-rasilovova-biography","type":"text","x":36,"y":389.734375,"w":543,"h":720.62109375,"text":"Antonie Rašilovová (1997) pochází z Prahy. Žila a studovala i na Vysočině a ve Francii. Vystudovala KALD DAMU v bakalářském titulu obor herectví a v magisterském titulu dramatické psaní. Je spoluzakladatelkou kolektivu TMEL, který se věnuje autorské objektové a loutkové tvorbě.\n\nJako herečka působila v divadle Venuše ve Švehlovce, Vzlet, Divadle X10, Na Zábradlí, v Národním divadle a s divadelním spolkem FRAS. Je autorkou divadelní hry Zadním vchodem na Hrad (uváděno v Divadle DISK), spoluautorkou imerzivní inscenace Poslední zhasne (uváděno v divadle Letí), autorkou a režisérkou divadelní bojovky Samá voda v Divadle v Dlouhé a spolupracuje s Českým rozhlasem.\n\nAbsolvovala dramaturgickou stáž v Maxim Gorki Theater v Berlíně, dramatickou stáž v Sala Becket v Barceloně, hereckou stáž na NYU v New Yorku a byla součástí vzniku mezinárodního textu Broken Mirror, který uvádělo Národní divadlo v Santiago de Chile.\n\nPro TMEL je spolutvůrkyní O jako Otesánek, Neboj, Houbo a Mouchy.","color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"biography","memberRole":"biography","anchor":"biography","translations":{"en":{"text":"Antonie Rašilovová (1997) is originally from Prague. She has also lived and studied in the Vysočina region and France. She holds a bachelor’s degree in acting and a master’s degree in dramatic writing from the Department of Alternative and Puppet Theatre at DAMU. She is a co-founder of TMEL, a collective dedicated to devised object and puppet theatre.\n\nAs an actress, she has worked with Venuše ve Švehlovce, Vzlet, Theatre X10, Theatre on the Balustrade, the National Theatre in Prague and the FRAS theatre collective. She is the author of Zadním vchodem na Hrad (staged at Theatre DISK), co-author of the immersive production Poslední zhasne (staged by Theatre LETÍ), and writer and director of Samá voda, a theatrical adventure game at Divadlo v Dlouhé. She also collaborates with Czech Radio.\n\nShe completed a dramaturgy placement at the Maxim Gorki Theater in Berlin, a playwriting residency at Sala Beckett in Barcelona and an acting placement at NYU in New York. She also contributed to the international collaborative text Broken Mirror, staged by the National Theatre in Santiago de Chile.\n\nWithin TMEL, she has co-created O jako Otesánek, Neboj, houbo! and Mouchy."}},"sectionId":"biography","contentHeight":721}],"member":{"name":"Antonie Rašilovová","sourcePageId":"home","sourceHeadingId":"b9","sourceAnchor":"kolektiv","sourceItemIds":["3b2b6098-c53c-455f-becd-986bcb297245","afd8eb15-aa15-4c6e-9992-c9756b129853"]},"sectionLayout":{"version":1,"enabled":true,"autoHeight":true,"bottomPadding":90,"minHeight":700,"sections":[{"id":"profile","headerId":"antonie-rasilovova-portrait","label":"portrait","gapBefore":0,"top":80,"bottom":327},{"id":"biography","headerId":"antonie-rasilovova-biography","label":"Antonie Rašilovová (1997) pochází z Prahy. Žila a studovala i na Vysočině a ve Francii. Vystudovala KALD DAMU v bakalářském titulu obor herectví a v magisterském titulu dramatické psaní. Je spoluzakladatelkou kolektivu TMEL, který se věnuje autorské objektové a loutkové tvorbě.\n\nJako herečka působila v divadle Venuše ve Švehlovce, Vzlet, Divadle X10, Na Zábradlí, v Národním divadle a s divadelním spolkem FRAS. Je autorkou divadelní hry Zadním vchodem na Hrad (uváděno v Divadle DISK), spoluautorkou imerzivní inscenace Poslední zhasne (uváděno v divadle Letí), autorkou a režisérkou divadelní bojovky Samá voda v Divadle v Dlouhé a spolupracuje s Českým rozhlasem.\n\nAbsolvovala dramaturgickou stáž v Maxim Gorki Theater v Berlíně, dramatickou stáž v Sala Becket v Barceloně, hereckou stáž na NYU v New Yorku a byla součástí vzniku mezinárodního textu Broken Mirror, který uvádělo Národní divadlo v Santiago de Chile.\n\nPro TMEL je spolutvůrkyní O jako Otesánek, Neboj, Houbo a Mouchy.","gapBefore":62.734375,"top":389.734375,"bottom":1110.734375}]}},{"id":"berta-doubkova","name":"Berta Doubková","title":"Berta Doubková — TMEL","kind":"member","width":615,"height":1431,"background":"#fff4d9","items":[{"id":"berta-doubkova-back","type":"text","x":36,"y":18,"w":230,"h":30,"text":"← Zpět","color":"#111111","size":18,"rotation":0,"opacity":1,"z":0,"align":"left","name":"back","memberRole":"back","link":"#/home/kolektiv","translations":{"en":{"text":"← Back"}},"sectionId":"","contentHeight":30},{"id":"berta-doubkova-portrait","type":"image","x":50,"y":80,"w":247,"h":247,"text":"","color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"portrait","memberRole":"portrait","anchor":"profile","src":"assets/b2af2db3b55f77d22e182943.svg","alt":"Berta Doubková — portrét","fit":"cover","translations":{"en":{"alt":"Berta Doubková — portrait"}},"sectionId":"profile","imageSource":{"pageId":"home","itemId":"fafcf6a3-d6f1-44cd-9997-0d285178245a"}},{"id":"berta-doubkova-name","type":"text","x":346,"y":107,"w":233,"h":72,"text":"Berta Doubková","color":"#111111","size":24,"rotation":0,"opacity":1,"z":0,"align":"left","name":"name","memberRole":"name","sectionId":"profile","contentHeight":72},{"id":"berta-doubkova-biography","type":"text","x":36,"y":389.3125,"w":543,"h":600,"text":"Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labo r":"#111111","size":18,"rotation":0,"opacity":1,"z":0,"align":"left","name":"back","memberRole":"back","link":"#/home/kolektiv","translations":{"en":{"text":"← Back"}},"sectionId":"","contentHeight":30},{"id":"jan-fronek-portrait","type":"image","x":50,"y":80,"w":247,"h":247,"text":"","color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"portrait","memberRole":"portrait","anchor":"profile","src":"assets/b2af2db3b55f77d22e182943.svg","alt":"Jan Froněk — portrét","fit":"cover","translations":{"en":{"alt":"Jan Froněk — portrait"}},"sectionId":"profile","imageSource":{"pageId":"home","itemId":"8a934403-477a-40d1-a1e0-f3a3951871a7"}},{"id":"jan-fronek-name","type":"text","x":346,"y":107,"w":233,"h":72,"text":"Jan Froněk","color":"#111111","size":24,"rotation":0,"opacity":1,"z":0,"align":"left","name":"name","memberRole":"name","sectionId":"profile","contentHeight":72},{"id":"jan-fronek-biography","type":"text","x":36,"y":389.875,"w":543,"h":600,"text":"Jan Froněk\nskladatel, dramaturg, režisér, herní designér, zakládající člen kolektivu TMEL\n\nJan Froněk absolvoval bakalářské studium režie na Katedře alternativního a loutkového divadla DAMU a následně magisterské studium herního designu na FAMU. Ve své tvorbě se pohybuje mezi divadlem, hudbou, videohrami a interaktivními médii. Zajímá se o zkoumání možností a hranic jednotlivých médií a jejich vzájemné propojování. Tento přístup uplatňuje v divadelní a hudební tvorbě, při tvorbě videoher i v galerijních projektech.\n\nMimo Kolektiv TMEL režijně spolupracoval s Divadlem LETÍ na projektu Poslední zhasne (2025). Jako herní designér se podílel na mezinárodně úspěšných videohrách Kingdom Come: Deliverance II (2025) a Prší (2026). Ve výtvarné a intermediální tvorbě vytvořil instalaci Perpeter pro výstavu Enter the Room v GHMP a instalaci Crowds uvedenou v rámci Y:Events LAN Party (2024). Podílel se také na tvorbě 3D sekvencí pro inscenaci The Good Times Are Over (2024) Karola Fila.","color":"#11111 size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"portrait","memberRole":"portrait","anchor":"profile","src":"assets/b2af2db3b55f77d22e182943.svg","alt":"Viktor Prokop — portrét","fit":"cover","translations":{"en":{"alt":"Viktor Prokop — portrait"}},"sectionId":"profile","imageSource":{"pageId":"home","itemId":"3c374c4b-f47a-4b8a-a9dc-7506632e0985"}},{"id":"viktor-prokop-name","type":"text","x":346,"y":107,"w":233,"h":72,"text":"Viktor Prokop","color":"#111111","size":24,"rotation":0,"opacity":1,"z":0,"align":"left","name":"name","memberRole":"name","sectionId":"profile","contentHeight":72},{"id":"viktor-prokop-biography","type":"text","x":36,"y":388.546875,"w":543,"h":600,"text":"Viktor Prokop\nrežisér, intermediální umělec, zakládající člen kolektivu TMEL\n\nViktor Prokop absolvoval bakalářské studium režie na Katedře alternativního a loutkového divadla DAMU a magisterské studium intermediální tvorby na Akademii výtvarných umění v Praze. Ve své tvorbě propojuje divadelní režii s přístupy současného výtvarného umění, objektového divadla a intermediální tvorby. Svou práci chápe jako prostor pro ohledávání světa v jeho nejednoznačnosti a hledání nových perspektiv vztahování se k sobě i svému okolí. Komplexních témat se často dotýká prostřednictvím drobných pozorování, gest a situací pracujících s nadsázkou a humorem.\n\nMimo Kolektiv TMEL spolupracoval s Emilem Rothermelem na projektech Makropulos Line (2021), experimentálním telefonním divadelním projektu pro Národní divadlo v Praze, a Nejlepší pohřeb všech dob (2025, Národní divadlo v Praze). Jako dramaturg se podílel také na inscenaci The Good Times Are Over (2024) Karola Fila.","color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"biography","memberRole":"biography","anchor":"biography","translations":{"en":{"text":"Viktor Prokop  \ntheatre director, intermedia artist, founding member of the TMEL collective\n\nViktor Prokop holds a bachelor’s degree in directing from the Department of Alternative and Puppet Theatre at DAMU and a master’s degree in intermedia art from the Academy of Fine Arts in Prague. His practice brings together theatre directing, contemporary visual art, object theatre and intermedia approaches. He sees his work as a space for exploring the world in its ambiguity and discovering new perspectives on how we relate to ourselves and our surroundings. He often approaches complex themes through small observations, gestures and situations shaped by playful exaggeration and humour.\n\nOutside the TMEL collective, he collaborated with Emil Rothermel on Makropulos Line (2021), an experimental telephone theatre project for the National Theatre in Prague, and The Best Funeral Ever (2025, National Theatre in Prague). He also worked as dramaturg on Karol Filo’s The Good Times Are Over (2024)."}},"sectionId":"biography","contentHeight":601},{"id":"viktor-prokop-links","type":"text","x":36,"y":1044.1015625,"w":543,"h":90,"text":"portfolio: www.viktorprokop.cz\n\ninstagram: @tvor.viktor\n","color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"links","memberRole":"links","anchor":"links","translations":{"en":{"text":"portfolio: www.viktorprokop.cz\n\ninstagram: @tvor.viktor\n\n"}},"sectionId":"links","contentHeight":109},{"id":"viktor-prokop-contact","type":"text","x":36,"y":1175.42578125,"w":543,"h":45,"text":"kontakt: prokop666@gmail.com","color":"#111111","size":21,"rotation":0,"opacity":1,"z":0,"align":"left","name":"contact","memberRole":"contact","anchor":"member-contact","translations":{"en":{"text":"contact: prokop666@gmail.com"}},"sectionId":"member-contact","contentHeight":45}],"member":{"name":"Viktor Prokop","sourcePageId":"home","sourceHeadingId":"b9","sourceAnchor":"kolektiv","sourceItemIds":["ef0432f7-f388-4823-8c60-ada159c3d14f","3c374c4b-f47a-4b8a-a9dc-7506632e0985"]},"sectionLayout":{"version":1,"enabled":true,"autoHeight":true,"bottomPadding":90,"minHeight":700,"sections":[{"id":"profi
